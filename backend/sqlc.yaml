version: '2'
sql:
  - engine: postgresql
    queries: queries
    schema:
      - migrations/000001_init.up.sql
      - migrations/000002_security.up.sql
      - migrations/000003_account_erasure.up.sql
      - migrations/000004_erasure_retry.up.sql
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
