name: Verify
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.4
          cache-dependency-path: backend/go.sum
      - run: go test ./... && go test -race ./internal/... && go test -race -tags=integration ./internal/service
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
# Real-provider browser journeys run locally with isolated credentials; CI browser setup is still pending.
